<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generic CRUD Template</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Generic CRUD Operations</h1>

    <!-- Form for creating/updating items -->
    <div id="itemForm">
      <input type="text" id="itemInput" placeholder="Enter item content" />
      <button id="createBtn">Create Item</button>
      <button id="updateBtn" style="display: none">Update Item</button>
      <button id="cancelBtn" style="display: none">Cancel</button>
    </div>

    <!-- List of items -->
    <ul id="itemList"></ul>

    <script src="crud_client.js"></script>
    <script src="app.js"></script>
  </body>
</html>
