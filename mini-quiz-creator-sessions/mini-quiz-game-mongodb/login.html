<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Super Quiz</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav id="site-navigation" class="navbar" aria-label="Main navigation"></nav>
    
        <div class="main-content">
            <main>
                <h1>Login Page</h1>
                <p>Login if you already have an account.</p>
                <p>Don't have an account? <a href="register.html">Register here</a>.</p>
                <form id="login-form">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                
                    <button id="login-submit" type="submit">Log in</button>
                    <p id="login-message" role="alert" aria-live="polite"></p>
                </form>
            </main>
        </div>
    
    </header>

    <script src="js/site_navigation.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
