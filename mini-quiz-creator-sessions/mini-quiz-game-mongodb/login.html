<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Creation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Super Quiz</a>
    
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="quiz_creation.html">Quiz Creation</a></li>
                <li><a class="login-btn" href="login.html">Login</a></li>
            </ul>
        </nav>
    
        <div class="main-content">
            <main>
                <h1>Login Page</h1>
                <p>Login if you already have an account.</p>
                <p>Don't have an account? <a href="register.html">Register here</a>.</p>
                <form action="#" method="post">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                
                    <button type="submit">Log in</button>
                </form>
            </main>
        </div>
    
    </header>

    <script src="js/quiz_creation.js"></script>
</body>
</html>
