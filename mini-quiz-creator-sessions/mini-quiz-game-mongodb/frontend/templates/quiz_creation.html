<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Creation - Super Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="account-page">
    <header>
        <nav id="site-navigation" class="navbar" aria-label="Main navigation" aria-busy="true"></nav>
    
        <div class="main-content">
            <main>
                <section class="account-dashboard quiz-dashboard" aria-labelledby="quiz-title">
                    <p class="account-eyebrow">Admin workspace</p>
                    <h1 id="quiz-title">Quiz management</h1>
                    <p class="account-intro">Create and manage quizzes for Super Quiz.</p>
                    <section class="quiz-container" aria-label="Quiz form and list">
                        <h2 id="quiz-form-title">Create a quiz</h2>
                        <div id="quiz-crud-controls" class="quiz-crud-controls"></div>
                        <h2 class="quiz-list-heading">Existing quizzes</h2>
                    </section>
                </section>
            </main>
        </div>
    
    </header>

    <script src="{{ url_for('static', filename='js/shared/site_navigation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/crud/crud_client.js') }}"></script>
    <script src="{{ url_for('static', filename='js/crud/crud_ui_manager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/quiz_creation.js') }}"></script>
